services:
  # -----------------------------------------------------------
  # Backend API Service
  # -----------------------------------------------------------
  - type: web
    name: sms-backend-api
    env: node
    plan: free
    buildCommand: pnpm install --prod=false && pnpm --filter @sms/database run build && pnpm --filter @sms/api run build
    startCommand: pnpm --filter @sms/database exec prisma db push --accept-data-loss --skip-generate && (pnpm --filter @sms/database db:seed || true) && pnpm --filter @sms/api run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sms-postgres-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # -----------------------------------------------------------
  # Frontend Web Service (Next.js)
  # -----------------------------------------------------------
  - type: web
    name: sms-frontend-web
    env: node
    plan: free
    buildCommand: pnpm install --prod=false && pnpm --filter @sms/database run build && pnpm --filter @sms/web run build
    startCommand: pnpm --filter @sms/web exec next start -p ${PORT:-3000}
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=450"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: sms-backend-api
          property: host

databases:
  # -----------------------------------------------------------
  # Managed PostgreSQL Database
  # -----------------------------------------------------------
  - name: sms-postgres-db
    databaseName: sms
    user: sms
    plan: free
